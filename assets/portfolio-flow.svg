<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio project flow</title>
  <desc id="desc">Animated path connecting bots, automation, apps, and AI experiments.</desc>
  <rect width="900" height="260" rx="22" fill="#efeee8"/>
  <path d="M90 130 C180 38 270 222 360 130 S540 38 630 130 S780 220 820 110" fill="none" stroke="#496833" stroke-width="3" stroke-dasharray="10 12"><animate attributeName="stroke-dashoffset" from="0" to="-44" dur="2s" repeatCount="indefinite"/></path>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(90 130)"><circle r="38" fill="#1d241b"/><text y="6" fill="#c8ed64" font-size="12">BOTS</text></g><g transform="translate(270 130)"><circle r="38" fill="#c8ed64"/><text y="5" fill="#1d241b" font-size="11">AUTOMATE</text></g><g transform="translate(450 130)"><circle r="38" fill="#1d241b"/><text y="5" fill="#c8ed64" font-size="11">APPS</text></g><g transform="translate(630 130)"><circle r="38" fill="#c8ed64"/><text y="5" fill="#1d241b" font-size="11">APIs</text></g><g transform="translate(810 130)"><circle r="38" fill="#1d241b"/><text y="5" fill="#c8ed64" font-size="11">AI / ML</text></g></g>
</svg>
